<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (XLSX) -->

    <style>

            background-color: #2563eb;
            color: white;
            border-radius: 50%;

            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);

<body class="bg-gray-100 font-sans h-screen flex flex-col overflow-hidden">

            </form>

    <!-- Script de Integración con Google Drive API -->
    <script>
        // CONFIGURACIÓN CLIENT ID GOOGLE DRIVE
        const CLIENT_ID = '214869796465-me9fen5avftl1jhgajlr5u37pn7v8kjk.apps.googleusercontent.com'; // Sustituir con tu ID de Google Cloud
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let accessToken = null;

        function initGoogleDrive() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.access_token) {
                        accessToken = tokenResponse.access_token;
                        document.getElementById('lblAuthText').textContent = "Drive Conectado";
                        document.getElementById('btnAuthDrive').className = "bg-green-700 text-white text-xs md:text-sm font-semibold px-3 py-1.5 rounded flex items-center shadow";
                        document.getElementById('btnSaveDrive').classList.remove('hidden');
                        document.getElementById('btnSaveDrive').classList.add('flex');
                        alert("¡Conexión con Google Drive exitosa!");
                    }
                },
            });
        }

        function handleAuthClick() {
            if (CLIENT_ID.includes('TU_CLIENT_ID')) {
                alert("Para conectar con tu Google Drive personal, coloca tu CLIENT_ID de Google Cloud Console en la línea 'CLIENT_ID' del código HTML.");
                return;
            }
            if (accessToken === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            }
        }

        async function saveToDrive() {
            if (!accessToken) {
                alert("Debes conectar primero tu cuenta de Google Drive.");
                return;
            }

            const ws = XLSX.utils.json_to_sheet(fullData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Base Master");
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            
            const file = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const metadata = {
                name: `Base_Clientes_OptiRuta_${new Date().toISOString().slice(0,10)}.xlsx`,
                mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            };

            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            try {
                const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: form
                });
                const result = await res.json();
                if (result.id) {
                    alert(`¡Archivo guardado con éxito en tu Google Drive! Nombre: ${metadata.name}`);
                } else {
                    alert("Ocurrió un error al guardar en Google Drive.");
                }
            } catch (err) {
                console.error(err);
                alert("Error de conexión al subir el archivo a Google Drive.");
            }
        }

        window.addEventListener('load', () => {
            setTimeout(initGoogleDrive, 1000);
        });
    </script>

    <!-- Script Principal de la App (Igual al ejecutable base) -->
    <script>
        let fullData = [];
        let filteredData = [];
        let map;
        let markersGroup;
        let polyline;
        let pickingMapMode = false;
        let sortableInstance;

        const demoData = [
            { RUTA: 1, "NOMBRE COMERCIAL": "ABARROTE ROCÍO", CALLE: "Francisco Villa", NUM: "1107", COLONIA: "Centro", CONTACTO: "Irene Guadalupe", TELEFONO: "6692178053", COORD_LAT: 23.209143, COORD_LON: -106.418027, Lu: "X", Ma: "", Mi: "", Ju: "", Vi: "", Sa: "", ORDEN_VISITA: 1 },
            { RUTA: 1, "NOMBRE COMERCIAL": "ABARROTES AMBER", CALLE: "Vicente Guerrero", NUM: "314", COLONIA: "Centro", CONTACTO: "Nayeli Alcaraz", TELEFONO: "66922213", COORD_LAT: 23.199236, COORD_LON: -106.416844, Lu: "X", Ma: "", Mi: "", Ju: "", Vi: "", Sa: "", ORDEN_VISITA: 2 },
            { RUTA: 1, "NOMBRE COMERCIAL": "ABARROTES DAMY", CALLE: "General Damy", NUM: "1708", COLONIA: "Centro", CONTACTO: "Maria Ruiz", TELEFONO: "669981234", COORD_LAT: 23.207147, COORD_LON: -106.414666, Lu: "X", Ma: "", Mi: "", Ju: "", Vi: "", Sa: "", ORDEN_VISITA: 3 },
            { RUTA: 1, "NOMBRE COMERCIAL": "ABARROTES KARMEL", CALLE: "German Evers", NUM: "1502", COLONIA: "Centro", CONTACTO: "Jose Perez", TELEFONO: "66912345", COORD_LAT: 23.209521, COORD_LON: -106.416255, Lu: "X", Ma: "", Mi: "", Ju: "", Vi: "", Sa: "", ORDEN_VISITA: 4 },
            { RUTA: 1, "NOMBRE COMERCIAL": "ABARROTES LA MORENA", CALLE: "Miguel Alemán", NUM: "0", COLONIA: "Centro", CONTACTO: "Juan Gomez", TELEFONO: "6692054790", COORD_LAT: 23.194795, COORD_LON: -106.423880, Lu: "X", Ma: "", Mi: "", Ju: "X", Vi: "", Sa: "", ORDEN_VISITA: 5 }
        ];

        window.onload = function() {
            initMap();
            fullData = demoData;
            populateRouteDropdown();
            filterData();
            setupSortable();
        };

        function initMap() {
            map = L.map('map').setView([23.209, -106.418], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
            markersGroup = L.layerGroup().addTo(map);
            map.on('click', function(e) {
                if (pickingMapMode) {
                    document.getElementById('editLat').value = e.latlng.lat.toFixed(6);
                    document.getElementById('editLon').value = e.latlng.lng.toFixed(6);
                    document.getElementById('mapPickerNotice').classList.add('hidden');
                    document.getElementById('modalEdit').classList.remove('hidden');
                    pickingMapMode = false;
                }
            });
        }

        function populateRouteDropdown() {
            const select = document.getElementById('selectRuta');
            const rutas = [...new Set(fullData.map(item => item.RUTA))].sort((a, b) => a - b);
            select.innerHTML = '<option value="">Todas las rutas</option>';
            rutas.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r;
                opt.textContent = `Ruta ${r}`;
                select.appendChild(opt);
            });
            if(rutas.length > 0) select.value = rutas[0];
        }

        function filterData() {
            const rutaVal = document.getElementById('selectRuta').value;
            const diaVal = document.getElementById('selectDia').value;

            filteredData = fullData.filter(item => {
                const matchRuta = rutaVal === "" || String(item.RUTA) === String(rutaVal);
                const matchDia = item[diaVal] && String(item[diaVal]).trim().toUpperCase() === "X";
                return matchRuta && matchDia;
            });

            filteredData.sort((a, b) => (a.ORDEN_VISITA || 999) - (b.ORDEN_VISITA || 999));
            filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);

            renderList();
            renderMap();
            updateStats();
        }

        function renderList() {
            const container = document.getElementById('clientList');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-400">
                    <i class="fa-solid fa-filter-circle-xmark text-3xl mb-2"></i>
                    <p>No se encontraron clientes para la Ruta y Día seleccionados.</p>
                </div>`;
                return;
            }

            filteredData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = "client-item bg-white hover:bg-blue-50/50 p-2.5 rounded border border-gray-200 mb-2 shadow-sm flex items-center justify-between transition group";
                div.dataset.id = index;

                div.innerHTML = `
                    <div class="flex items-center space-x-2.5 overflow-hidden">
                        <i class="fa-solid fa-grip-vertical text-gray-300 group-hover:text-gray-500 cursor-move text-sm"></i>
                        <input type="number" value="${item.ORDEN_VISITA}" min="1" max="${filteredData.length}" 
                            onchange="changeOrderDirect(${index}, this.value)" 
                            class="w-8 text-center font-bold text-xs bg-gray-100 border rounded py-0.5 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <div class="truncate cursor-pointer" onclick="focusClientOnMap(${index})">
                            <h4 class="font-bold text-xs text-gray-900 truncate">${item['NOMBRE COMERCIAL'] || 'Sin nombre'}</h4>
                            <p class="text-[11px] text-gray-500 truncate">${item.CALLE || ''} ${item.NUM || ''}, ${item.COLONIA || ''}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-1 no-print">
                        <button onclick="moveUp(${index})" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-chevron-up"></i></button>
                        <button onclick="moveDown(${index})" class="text-gray-400 hover:text-blue-600 p-1"><i class="fa-solid fa-chevron-down"></i></button>
                        <button onclick="openEditModal(${index})" class="text-blue-600 hover:text-blue-900 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderMap() {
            markersGroup.clearLayers();
            if (polyline) map.removeLayer(polyline);
            const points = [];

            filteredData.forEach((item, index) => {
                if (item.COORD_LAT && item.COORD_LON && !isNaN(item.COORD_LAT) && !isNaN(item.COORD_LON)) {
                    const latLng = [parseFloat(item.COORD_LAT), parseFloat(item.COORD_LON)];
                    points.push(latLng);

                    const customIcon = L.divIcon({
                        className: '',
                        html: `<div class="custom-marker" id="marker-${index}">${item.ORDEN_VISITA}</div>`,
                        iconSize: [28, 28],
                        iconAnchor: [14, 14]
                    });

                    const marker = L.marker(latLng, { icon: customIcon });
                    marker.bindPopup(`
                        <div class="p-1">
                            <b class="text-sm">${item['NOMBRE COMERCIAL']}</b><br>
                            <span class="text-xs text-gray-600">Orden: #${item.ORDEN_VISITA}</span><br>
                            <span class="text-xs">${item.CALLE || ''} ${item.NUM || ''}</span>
                        </div>
                    `);
                    markersGroup.addLayer(marker);
                }
            });

            if (points.length > 0) {
                polyline = L.polyline(points, { color: '#2563eb', weight: 4, opacity: 0.7, dashArray: '6, 8' }).addTo(map);
                map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
            }
        }

        function setupSortable() {
            const el = document.getElementById('clientList');
            sortableInstance = Sortable.create(el, {
                animation: 150,
                handle: '.fa-grip-vertical',
                onEnd: function (evt) {
                    const movedItem = filteredData.splice(evt.oldIndex, 1)[0];
                    filteredData.splice(evt.newIndex, 0, movedItem);
                    filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);
                    renderList();
                    renderMap();
                }
            });
        }

        function moveUp(index) {
            if (index <= 0) return;
            const temp = filteredData[index];
            filteredData[index] = filteredData[index - 1];
            filteredData[index - 1] = temp;
            filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);
            renderList();
            renderMap();
        }

        function moveDown(index) {
            if (index >= filteredData.length - 1) return;
            const temp = filteredData[index];
            filteredData[index] = filteredData[index + 1];
            filteredData[index + 1] = temp;
            filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);
            renderList();
            renderMap();
        }

        function changeOrderDirect(index, newPos) {
            newPos = parseInt(newPos) - 1;
            if (isNaN(newPos) || newPos < 0 || newPos >= filteredData.length) return;
            const movedItem = filteredData.splice(index, 1)[0];
            filteredData.splice(newPos, 0, movedItem);
            filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);
            renderList();
            renderMap();
        }

        function optimizeRoute() {
            if (filteredData.length <= 2) return;
            const validCoords = filteredData.filter(d => d.COORD_LAT && d.COORD_LON);
            if (validCoords.length === 0) {
                alert("No hay suficientes clientes con coordenadas GPS para optimizar.");
                return;
            }

            let unvisited = [...filteredData];
            let route = [unvisited.shift()];

            while (unvisited.length > 0) {
                let current = route[route.length - 1];
                let nearestIdx = -1;
                let minDistance = Infinity;

                unvisited.forEach((item, idx) => {
                    let d = getDistance(current.COORD_LAT, current.COORD_LON, item.COORD_LAT, item.COORD_LON);
                    if (d < minDistance) {
                        minDistance = d;
                        nearestIdx = idx;
                    }
                });

                if (nearestIdx !== -1) {
                    route.push(unvisited.splice(nearestIdx, 1)[0]);
                } else {
                    route.push(unvisited.shift());
                }
            }

            filteredData = route;
            filteredData.forEach((item, idx) => item.ORDEN_VISITA = idx + 1);
            renderList();
            renderMap();
            updateStats();
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return Infinity;
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateStats() {
            document.getElementById('lblTotalClientes').textContent = filteredData.length;
            document.getElementById('lblBadgeCount').textContent = filteredData.length;

            let dist = 0;
            for (let i = 0; i < filteredData.length - 1; i++) {
                let d = getDistance(
                    filteredData[i].COORD_LAT, filteredData[i].COORD_LON,
                    filteredData[i+1].COORD_LAT, filteredData[i+1].COORD_LON
                );
                if (d !== Infinity) dist += d;
            }
            document.getElementById('lblDistancia').textContent = `${dist.toFixed(2)} km`;
        }

        function focusClientOnMap(index) {
            const item = filteredData[index];
            if (item.COORD_LAT && item.COORD_LON) {
                map.setView([item.COORD_LAT, item.COORD_LON], 16);
                switchTab('map');
            }
        }

        function switchTab(tab) {
            const listP = document.getElementById('panelList');
            const mapP = document.getElementById('panelMap');
            const btnL = document.getElementById('btnTabList');
            const btnM = document.getElementById('btnTabMap');

            if (tab === 'list') {
                listP.classList.remove('hidden');
                mapP.classList.add('hidden');
                btnL.className = "flex-1 py-2 text-center font-bold text-sm text-blue-700 border-b-2 border-blue-700 bg-white";
                btnM.className = "flex-1 py-2 text-center font-bold text-sm text-gray-600";
            } else {
                listP.classList.add('hidden');
                mapP.classList.remove('hidden');
                btnM.className = "flex-1 py-2 text-center font-bold text-sm text-blue-700 border-b-2 border-blue-700 bg-white";
                btnL.className = "flex-1 py-2 text-center font-bold text-sm text-gray-600";
                setTimeout(() => map.invalidateSize(), 200);
            }
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                fullData = XLSX.utils.sheet_to_json(firstSheet);
                populateRouteDropdown();
                filterData();
            };
            reader.readAsArrayBuffer(file);
        }

        function openEditModal(index) {
            const item = filteredData[index];
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-pen mr-2"></i>Editar Cliente';
            document.getElementById('editIndex').value = index;
            document.getElementById('editRuta').value = item.RUTA || 1;
            document.getElementById('editNombre').value = item['NOMBRE COMERCIAL'] || '';
            document.getElementById('editContacto').value = item.CONTACTO || '';
            document.getElementById('editTelefono').value = item.TELEFONO || '';
            document.getElementById('editCalle').value = item.CALLE || '';
            document.getElementById('editNum').value = item.NUM || '';
            document.getElementById('editColonia').value = item.COLONIA || '';

            ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'].forEach(d => {
                document.getElementById(`chk${d}`).checked = item[d] === "X";
            });

            document.getElementById('editLat').value = item.COORD_LAT || '';
            document.getElementById('editLon').value = item.COORD_LON || '';

            document.getElementById('modalEdit').classList.remove('hidden');
            document.getElementById('modalEdit').classList.add('flex');
        }

        function createNewClient() {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-user-plus mr-2"></i>Nuevo Cliente';
            document.getElementById('frmEdit').reset();
            document.getElementById('editIndex').value = "-1";
            document.getElementById('modalEdit').classList.remove('hidden');
            document.getElementById('modalEdit').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modalEdit').classList.add('hidden');
            document.getElementById('modalEdit').classList.remove('flex');
        }

        function saveClient(e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            
            const clientData = {
                RUTA: parseInt(document.getElementById('editRuta').value),
                "NOMBRE COMERCIAL": document.getElementById('editNombre').value,
                CONTACTO: document.getElementById('editContacto').value,
                TELEFONO: document.getElementById('editTelefono').value,
                CALLE: document.getElementById('editCalle').value,
                NUM: document.getElementById('editNum').value,
                COLONIA: document.getElementById('editColonia').value,
                COORD_LAT: parseFloat(document.getElementById('editLat').value) || null,
                COORD_LON: parseFloat(document.getElementById('editLon').value) || null
            };

            ['Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sa'].forEach(d => {
                clientData[d] = document.getElementById(`chk${d}`).checked ? "X" : "";
            });

            if (index >= 0) {
                Object.assign(filteredData[index], clientData);
            } else {
                clientData.ORDEN_VISITA = filteredData.length + 1;
                fullData.push(clientData);
            }

            closeModal();
            populateRouteDropdown();
            filterData();
        }

        function startPickOnMap() {
            closeModal();
            pickingMapMode = true;
            document.getElementById('mapPickerNotice').classList.remove('hidden');
            switchTab('map');
        }

        function cancelMapPick() {
            pickingMapMode = false;
            document.getElementById('mapPickerNotice').classList.add('hidden');
            document.getElementById('modalEdit').classList.remove('hidden');
        }
    </script>
</body>
</html>
